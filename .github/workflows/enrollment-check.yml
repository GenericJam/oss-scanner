name: Enrollment build verification

on:
  push:
    branches: [enrollment-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        project: [mob, mob_new, mob_dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Validate enrollment
        run: python tools/validate.py
      - name: Build with the scanner's own checker
        run: python tools/check "${{ matrix.project }}" --no-shell
      - name: Run host tests with networking disabled
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          case "$PROJECT" in
            mob_dev)
              TEST_ARGS=(--exclude macos_only --exclude requires_zig)
              ;;
            mob_new)
              TEST_ARGS=(--exclude requires_android_ndk)
              ;;
            *)
              TEST_ARGS=()
              ;;
          esac
          docker run --rm --network none --cpus 2 --memory 8g -w /src \
            -e MIX_ENV=test "oss-scanner-check/built:$PROJECT" \
            mix test "${TEST_ARGS[@]}"
      - name: Run portable native harnesses offline
        if: matrix.project == 'mob'
        run: |
          docker run --rm --network none -w /src oss-scanner-check/built:mob \
            sh -ec 'for test in dist_port_test dist_cookie_test init_args_test; do ./test/native/$test; done'
      - name: Exercise project generation offline
        if: matrix.project == 'mob_new'
        run: |
          docker run --rm --network none -w /src -e MIX_ENV=dev oss-scanner-check/built:mob_new \
            sh -ec 'mix mob.new scan_example --no-install --dest /tmp/mob-scan && test -f /tmp/mob-scan/scan_example/mix.exs && test -f /tmp/mob-scan/scan_example/android/app/src/main/AndroidManifest.xml'
